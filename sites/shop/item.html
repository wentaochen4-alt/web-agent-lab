<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top"></header>
  <main id="box"></main>
  <script src="shop.js"></script>
  <script>
    renderHeader();
    const p = findProduct(new URLSearchParams(location.search).get("id"));
    const box = document.getElementById("box");
    // 当前选择；没有尺码的商品 size 留空
    const pick = { color: null, size: null, qty: 1 };

    function chips(name, values, unit = "") {
      return `<div class="option"><span>${name}</span><div class="chips">` +
        values.map((v) => `<button type="button" class="chip" data-opt="${name}" data-val="${v}" aria-pressed="false">${v}${unit}</button>`).join("") +
        `</div></div>`;
    }

    if (!p) {
      box.innerHTML = '<p class="error">商品不存在。</p><p><a href="index.html">返回首页</a></p>';
    } else {
      box.innerHTML = `
        <h2>${p.ad ? '<span class="ad">广告</span>' : ""}${p.name}</h2>
        <p><span class="price">${money(p.price)}</span>　<span class="muted">评分 ${p.rating} · 已售 ${p.sales}</span></p>
        ${chips("颜色", p.colors)}
        ${p.sizes.length ? chips("尺码", p.sizes, " 码") : ""}
        <div class="option"><span>数量</span>
          <div class="qty"><button type="button" id="minus" aria-label="减少">−</button><output id="qty">1</output><button type="button" id="plus" aria-label="增加">+</button></div>
        </div>
        <div class="actions">
          <button type="button" class="btn secondary" id="add">加入购物车</button>
          <button type="button" class="btn" id="buy">立即购买</button>
        </div>
        <p class="notice" id="notice"></p>`;

      // 颜色、尺码：点一下选中（同组只能选一个）
      box.querySelectorAll("button[data-opt]").forEach((b) => b.addEventListener("click", () => {
        box.querySelectorAll(`button[data-opt="${b.dataset.opt}"]`).forEach((x) => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        if (b.dataset.opt === "颜色") pick.color = b.dataset.val;
        else pick.size = Number(b.dataset.val);
      }));
      const qtyEl = document.getElementById("qty");
      document.getElementById("minus").onclick = () => { pick.qty = Math.max(1, pick.qty - 1); qtyEl.textContent = pick.qty; };
      document.getElementById("plus").onclick = () => { pick.qty = Math.min(99, pick.qty + 1); qtyEl.textContent = pick.qty; };

      const notice = document.getElementById("notice");
      function tryAdd() {
        if (!pick.color || (p.sizes.length && !pick.size)) {
          notice.className = "notice error";
          notice.textContent = p.sizes.length ? "请先选择颜色和尺码。" : "请先选择颜色。";
          return false;
        }
        addToCart(p.id, pick.color, pick.size, pick.qty);
        return true;
      }
      document.getElementById("add").onclick = () => {
        if (tryAdd()) {
          notice.className = "notice ok";
          notice.innerHTML = `已加入购物车：${pick.color}${pick.size ? " / " + pick.size + " 码" : ""} × ${pick.qty}　<a href="cart.html">去购物车结算</a>`;
        }
      };
      document.getElementById("buy").onclick = () => { if (tryAdd()) location.href = "cart.html"; };
    }
  </script>
</body>
</html>
