<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>我的账户</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>我的账户</h1>
    <p class="tag">本地测试站 · 用来测试“需要登录”的页面</p>
  </header>
  <main>
    <!-- 模拟购物网站：不登录就看不到内容 -->
    <p class="error">请先登录后再查看会员积分和预订记录。</p>
    <form>
      <label>手机号<input type="text" name="phone" placeholder="请输入手机号"></label>
      <label>验证码<input type="text" name="code" placeholder="请输入短信验证码"></label>
      <button type="button" class="btn">登录</button>
    </form>
  </main>
</body>
</html>
